name: TeachApp
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teachapp-ui-smoke
          path: artifacts/ui/
          retention-days: 7
