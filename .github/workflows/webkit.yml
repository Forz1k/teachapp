name: TeachApp WebKit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: npx playwright install --with-deps webkit
      - run: node tools/webkit-smoke.mjs
      - name: Prepare published 5.1.0 baseline
        run: |
          git fetch --no-tags --depth=1 origin de8b0991411cb85fb2aaf0c739e966552bc98077
          mkdir -p "$RUNNER_TEMP/teachapp-5.1.0"
          git archive de8b0991411cb85fb2aaf0c739e966552bc98077 | tar -x -C "$RUNNER_TEMP/teachapp-5.1.0"
      - name: Verify real PWA update from 5.1.0
        run: node tools/upgrade-smoke.mjs "$RUNNER_TEMP/teachapp-5.1.0"
