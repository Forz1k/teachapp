name: TeachApp WebKit
on:
  push:
    branches:
      - 'roadmap/8.0-integration'
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: npx playwright install --with-deps webkit
      - run: node tools/webkit-smoke.mjs
      - name: Rehearse actual application against isolated encrypted owner backend
        run: node tools/vault-app-smoke.mjs
      - name: Build verified static candidate for actual update and rollback
        run: |
          node tools/build-static-release.mjs "$RUNNER_TEMP/teachapp-candidate"
          node tools/release-package-integrity.mjs --create "$RUNNER_TEMP/teachapp-candidate" "$(git rev-parse HEAD)" "$RUNNER_TEMP/teachapp-candidate-manifest.json"
          node tools/release-package-integrity.mjs --verify "$RUNNER_TEMP/teachapp-candidate" "$(git rev-parse HEAD)" "$RUNNER_TEMP/teachapp-candidate-manifest.json"
      - name: Verify actual static v11 migration, login and journal
        run: node tools/encrypted-app-smoke.mjs "$RUNNER_TEMP/teachapp-candidate"
      - name: Prepare published 5.1.1 baseline
        run: |
          git fetch --no-tags --depth=1 origin 1bd6998027db193558b31350d4f6a54dd7414ed3
          mkdir -p "$RUNNER_TEMP/teachapp-5.1.1"
          git archive 1bd6998027db193558b31350d4f6a54dd7414ed3 | tar -x -C "$RUNNER_TEMP/teachapp-5.1.1"
      - name: Verify real PWA update from 5.1.1
        run: node tools/upgrade-smoke.mjs "$RUNNER_TEMP/teachapp-5.1.1" "$RUNNER_TEMP/teachapp-candidate"
      - name: Prepare published 6.0.0 baseline
        run: |
          git fetch --no-tags --depth=1 origin f7066c1c57cfe63bdfc98b10d8e8b7f6f52d9b22
          mkdir -p "$RUNNER_TEMP/teachapp-6.0.0"
          git archive f7066c1c57cfe63bdfc98b10d8e8b7f6f52d9b22 | tar -x -C "$RUNNER_TEMP/teachapp-6.0.0"
      - name: Verify real PWA update from 6.0.0
        run: node tools/upgrade-smoke.mjs "$RUNNER_TEMP/teachapp-6.0.0" "$RUNNER_TEMP/teachapp-candidate"
      - name: Prepare published 6.0.2 baseline
        run: |
          git fetch --no-tags --depth=1 origin d4cb5bb3c4cae0658e7b2d4816679f367f8d4a19
          mkdir -p "$RUNNER_TEMP/teachapp-6.0.2"
          git archive d4cb5bb3c4cae0658e7b2d4816679f367f8d4a19 | tar -x -C "$RUNNER_TEMP/teachapp-6.0.2"
      - name: Verify real PWA update from 6.0.2
        run: node tools/upgrade-smoke.mjs "$RUNNER_TEMP/teachapp-6.0.2" "$RUNNER_TEMP/teachapp-candidate"
      - name: Prepare stable 6.0.6 baseline
        run: |
          git fetch --no-tags --depth=1 origin 4d04398ee48d5f9ea359e50d5f43cd5dfb9b2d0c
          mkdir -p "$RUNNER_TEMP/teachapp-6.0.6"
          git archive 4d04398ee48d5f9ea359e50d5f43cd5dfb9b2d0c | tar -x -C "$RUNNER_TEMP/teachapp-6.0.6"
      - name: Verify real PWA update from 6.0.6
        run: node tools/upgrade-smoke.mjs "$RUNNER_TEMP/teachapp-6.0.6" "$RUNNER_TEMP/teachapp-candidate"
      - name: Prepare stable 6.0.7 baseline
        run: |
          git fetch --no-tags --depth=1 origin 1017f187a3cc8c26b46e4936f9c60773b4512783
          mkdir -p "$RUNNER_TEMP/teachapp-6.0.7"
          git archive 1017f187a3cc8c26b46e4936f9c60773b4512783 | tar -x -C "$RUNNER_TEMP/teachapp-6.0.7"
      - name: Verify real PWA update and native rollback from 6.0.7
        run: node tools/upgrade-smoke.mjs "$RUNNER_TEMP/teachapp-6.0.7" "$RUNNER_TEMP/teachapp-candidate"
