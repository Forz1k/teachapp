name: TeachApp WebKit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: npx playwright install --with-deps webkit
      - run: node tools/webkit-smoke.mjs
      - name: Prepare published 5.1.1 baseline
        run: |
          git fetch --no-tags --depth=1 origin 1bd6998027db193558b31350d4f6a54dd7414ed3
          mkdir -p "$RUNNER_TEMP/teachapp-5.1.1"
          git archive 1bd6998027db193558b31350d4f6a54dd7414ed3 | tar -x -C "$RUNNER_TEMP/teachapp-5.1.1"
      - name: Verify real PWA update from 5.1.1
        run: node tools/upgrade-smoke.mjs "$RUNNER_TEMP/teachapp-5.1.1"
