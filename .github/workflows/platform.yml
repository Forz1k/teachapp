name: TeachApp Platform synthetic
on:
  push:
    branches:
      - 'roadmap/8.0-integration'
      - 'roadmap/8.0-final'
      - main
  pull_request:
    paths:
      - 'package.json'
      - 'server/platform-*.mjs'
      - 'server/workspace-policy.mjs'
      - 'js/platform-client.js'
      - 'platform-dev/**'
      - 'platform-candidate/**'
      - 'wrangler.platform-candidate.jsonc'
      - 'tools/platform-candidate-smoke.mjs'
      - 'tools/prototypes/push-transport-lab.mjs'
      - 'wrangler.platform-dev.jsonc'
      - 'tools/platform-smoke.mjs'
      - '.github/workflows/platform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.65.1 wrangler@4.161.0
      - run: npx --yes wrangler@4.161.0 deploy --config wrangler.platform-dev.jsonc --dry-run --outdir "${RUNNER_TEMP}/platform-build"
      - run: node tools/platform-smoke.mjs
      - run: npx --yes wrangler@4.161.0 deploy --config wrangler.platform-candidate.jsonc --dry-run --outdir "${RUNNER_TEMP}/platform-candidate-build"
      - run: node tools/platform-candidate-smoke.mjs "$RUNNER_TEMP/platform-candidate-build"
