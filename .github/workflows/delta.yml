name: TeachApp Delta synthetic
on:
  push:
    branches:
      - 'roadmap/8.0-integration'
  pull_request:
    paths:
      - 'package.json'
      - 'server/delta-*.mjs'
      - 'server/cloudflare-protocol.mjs'
      - 'server/cloudflare-relay.mjs'
      - 'server/migration-receipt.mjs'
      - 'server/device-trust.mjs'
      - 'wrangler.migration-source-dev.jsonc'
      - 'js/sync.js'
      - 'js/privacy.js'
      - 'js/delta-anchor.js'
      - 'tools/delta-smoke.mjs'
      - 'tools/delta-v3-migration-smoke.mjs'
      - 'wrangler.delta-candidate.jsonc'
      - 'delta-dev/**'
      - 'platform-dev/platform.css'
      - 'wrangler.delta-dev.jsonc'
      - '.github/workflows/delta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.65.1 wrangler@4.161.0
      - run: npx --yes wrangler@4.161.0 deploy --config wrangler.delta-dev.jsonc --dry-run --outdir "${RUNNER_TEMP}/delta-build"
      - run: npx --yes wrangler@4.161.0 deploy --config wrangler.migration-source-dev.jsonc --dry-run --outdir "${RUNNER_TEMP}/migration-source-build"
      - run: npx --yes wrangler@4.161.0 deploy --config wrangler.delta-candidate.jsonc --dry-run --outdir "${RUNNER_TEMP}/delta-candidate-build"
      - run: node tools/delta-smoke.mjs
