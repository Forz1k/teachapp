name: TeachApp Firebase archive
on:
  pull_request:
    paths:
      - 'firebase-portal-v2.rules.json'
      - 'firebase-archive-dev.json'
      - 'tools/firebase-archive-emulator.mjs'
      - 'js/public-archive.js'
      - '.github/workflows/firebase-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npx --yes firebase-tools@14.12.1 emulators:exec --project demo-teachapp --config firebase-archive-dev.json --only database,auth "node tools/firebase-archive-emulator.mjs"
